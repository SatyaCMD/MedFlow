version: '3.8'

services:
  # Nginx Gateway Router
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "8082:80"
      - "4433:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: always
    networks:
      - medflow-net

  # Backend Express API Service
  api:
    build:
      context: .
      dockerfile: ./infra/docker/api.prod.Dockerfile
    container_name: api
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/medicore}
      - REDIS_URI=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
      - JAEGER_URL=http://jaeger:14268/api/traces
      - JWT_ACCESS_SECRET=your_production_access_secret_key_32_chars
      - JWT_REFRESH_SECRET=your_production_refresh_secret_key_32_chars
      - APP_PEPPER=your_production_pepper_key_16_chars_chili
    depends_on:
      - mongo
      - redis
      - rabbitmq
      - kafka
    restart: always
    networks:
      - medflow-net

  # RabbitMQ Async Queue Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Web Management Console
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    networks:
      - medflow-net

  # Apache Zookeeper for Kafka Coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - medflow-net

  # Apache Kafka High-Throughput Event Engine
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - medflow-net

  # Jaeger Distributed Tracing Collector & UI
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "14268:14268" # Collector HTTP
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - medflow-net

  # Frontend Client Service
  web:
    build:
      context: .
      dockerfile: ./infra/docker/web.prod.Dockerfile
    container_name: web
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
      - NODE_ENV=production
    restart: always
    networks:
      - medflow-net

  # MongoDB Database Engine
  mongo:
    image: mongo:6.0
    container_name: mongo
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27018:27017"
    volumes:
      - mongo_prod_data:/data/db
    restart: always
    networks:
      - medflow-net

  # Redis Cache & Broker Store
  redis:
    image: redis:7.0-alpine
    container_name: redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6380:6379"

    volumes:
      - redis_prod_data:/data
    restart: always
    networks:
      - medflow-net

  # Mailpit SMTP Capture server
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025" # Web UI Port
      - "1025:1025" # SMTP Port
    restart: always
    networks:
      - medflow-net

  # Prometheus Observability Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: always
    networks:
      - medflow-net

  # Grafana Dashboard Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/medflow-dashboard.json:/var/lib/grafana/dashboards/medflow-dashboard.json
    ports:
      - "3005:3000" # Map to port 3005 to avoid conflict with Web application
    depends_on:
      - prometheus
    restart: always
    networks:
      - medflow-net

  # SonarQube Quality Scanner Server
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: always
    networks:
      - medflow-net

  # Jenkins CI/CD Orchestration Server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8088:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket for Docker builds
    restart: always
    networks:
      - medflow-net

volumes:
  mongo_prod_data:
  redis_prod_data:
  rabbitmq_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_data:

networks:
  medflow-net:
    driver: bridge
