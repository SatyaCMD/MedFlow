worker_processes auto;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Edge Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # Edge Rate Limiting Protection
    limit_req_zone $binary_remote_addr zone=api_edge_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:20m;

    # High-Throughput Upstream API Cluster with Connection Reuse (Keep-Alive)
    upstream medflow_api_cluster {
        least_conn;
        server api:4000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name localhost;

        # Enterprise Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Health Probe Endpoint
        location /lb-health {
            access_log off;
            return 200 '{"status":"healthy","gateway":"online"}';
        }

        # Reverse Proxy to API Cluster
        location /api/ {
            limit_req zone=api_edge_limit burst=50 nodelay;
            limit_conn addr_conn_limit 100;

            proxy_pass http://medflow_api_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Custom Error Response
        error_page 502 503 504 /custom_50x.json;
        location = /custom_50x.json {
            return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"MedFlow gateway load balancer failover."}}';
        }
    }
}
