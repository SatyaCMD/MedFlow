apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medflow-api-pdb
  namespace: medflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: medflow-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medflow-web-pdb
  namespace: medflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: medflow-web
