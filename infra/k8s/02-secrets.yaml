apiVersion: v1
kind: Secret
metadata:
  name: medflow-secrets
  namespace: medflow
  labels:
    app.kubernetes.io/name: medflow-secrets
    app.kubernetes.io/part-of: medicore360
type: Opaque
stringData:
  MONGO_URI: "mongodb://medflow-mongodb.medflow.svc.cluster.local:27017/medicore_production"
  REDIS_URI: "redis://medflow-redis.medflow.svc.cluster.local:6379"
  JWT_ACCESS_SECRET: "k8s-prod-super-secure-jwt-access-secret-key-32-chars-min"
  JWT_REFRESH_SECRET: "k8s-prod-super-secure-jwt-refresh-secret-key-32-chars-min"
  APP_PEPPER: "k8s-prod-app-pepper-secret-key-salt-2026"
  SMTP_HOST: "mailpit.medflow.svc.cluster.local"
  SMTP_PORT: "1025"
  RABBITMQ_USER: "admin"
  RABBITMQ_PASS: "adminpass123"
