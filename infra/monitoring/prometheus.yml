global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus-self'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          service: 'prometheus'

  - job_name: 'medflow-api-host'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          environment: 'development'
          service: 'express-api'

  - job_name: 'grafana-telemetry'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['grafana:3000']
        labels:
          environment: 'production'
          service: 'grafana-dashboard'
