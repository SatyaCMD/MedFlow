<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#334155" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#emblem-grad)" stroke-width="3" opacity="0.4" />

  <g filter="url(#shadow)">
    <rect x="216" y="112" width="80" height="288" rx="28" fill="url(#emblem-grad)" />
    <rect x="112" y="216" width="288" height="80" rx="28" fill="url(#emblem-grad)" />

    <rect x="232" y="132" width="48" height="248" rx="18" fill="#FFFFFF" opacity="0.95" />
    <rect x="132" y="232" width="248" height="48" rx="18" fill="#FFFFFF" opacity="0.95" />

    <path d="M 80 256 L 160 256 L 190 200 L 225 310 L 260 160 L 295 290 L 320 230 L 350 256 L 432 256"
          fill="none"
          stroke="#0F172A"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round" />
    
    <path d="M 80 256 L 160 256 L 190 200 L 225 310 L 260 160 L 295 290 L 320 230 L 350 256 L 432 256"
          fill="none"
          stroke="#38BDF8"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)" />
  </g>

  <circle cx="260" cy="160" r="10" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="225" cy="310" r="8" fill="#0284C7" />
  <circle cx="295" cy="290" r="8" fill="#0D9488" />
</svg>
