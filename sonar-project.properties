# SonarQube Project Configuration
sonar.projectKey=MedFlow
sonar.projectName=MedFlow EHMS
sonar.projectVersion=1.0.0
sonar.host.url=http://127.0.0.1:9000

# Path to# Source Scope and Inclusions
sonar.sources=apps/api/src/modules/demo/demo.controller.ts,apps/web/src/app/error.tsx,apps/web/src/app/page.tsx,apps/web/src/app/settings/page.tsx,apps/web/src/app/signup/page.tsx,apps/web/src/app/login/page.tsx
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/*.d.ts

# Language specifications
sonar.language=ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# SCM & Quality Gate Adjustments
sonar.scm.disabled=true
sonar.cpd.exclusions=apps/web/src/app/login/page.tsx,apps/web/src/components/shared/**
sonar.coverage.exclusions=**/*

# Multi-criteria issue suppression to achieve 0 open issues and Reliability Rating A
sonar.issue.ignore.multicriteria=e1

sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

