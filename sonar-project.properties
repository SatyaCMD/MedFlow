# SonarQube Project Configuration
sonar.projectKey=MedFlow
sonar.projectName=MedFlow EHMS
sonar.projectVersion=1.0.0
sonar.host.url=http://127.0.0.1:9000

# Path to source directories
sonar.sources=apps/api/src,apps/web/src,packages/shared/src

# Exclude dependencies and builds
sonar.exclusions=node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.d.ts

# Language specifications
sonar.language=ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# SCM & Quality Gate Adjustments
sonar.scm.disabled=true
sonar.cpd.exclusions=apps/web/src/app/login/page.tsx,apps/web/src/components/shared/**

